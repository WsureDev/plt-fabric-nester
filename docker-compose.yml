services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18191:80"
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    stdin_open: true
    tty: false
    ports:
      - "18192:8765"
    environment:
      MCP_FILE_HOST: 0.0.0.0
      MCP_PUBLIC_BASE_URL: http://127.0.0.1:18192
