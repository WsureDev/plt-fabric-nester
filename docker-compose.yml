services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18191:80"
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "18192:8765"
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_PUBLIC_BASE_URL: http://host.docker.internal:18192
